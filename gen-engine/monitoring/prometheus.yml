global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'gen-engine'
    static_configs:
      - targets: ['gen-engine:8001']
    metrics_path: '/metrics'
    scrape_interval: 5s

  - job_name: 'ollama'
    static_configs:
      - targets: ['ollama:11434']
    scrape_interval: 30s

  - job_name: 'kokoro-tts'
    static_configs:
      - targets: ['kokoro-tts:8880']
    scrape_interval: 30s