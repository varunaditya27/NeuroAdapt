# gen-engine Docker Compose Stack
# Local development environment with all services
#
# STARTUP:
#   cp .env.example .env  # configure first
#   docker-compose up -d
#
# SERVICES:
#   - gen-engine: FastAPI server (port 8001)
#   - ollama: Gemma 4 E2B LLM service (port 11434)
#   - kokoro-tts: Audio generation service (port 8880)
#   - prometheus: Metrics collection (port 9090)
#
# DEPENDENCIES:
#   - Docker Engine 20.10+
#   - Docker Compose 1.29+
#   - ~30GB disk space (models + containers)

services:
  ollama:
    image: ollama/ollama:latest
    container_name: neuroadapt-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - neuroadapt
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"

  kokoro-tts:
    # Build from local Dockerfile — do not use inline pip install
    # See services/kokoro/Dockerfile for actual image definition
    build:
      context: ./services/kokoro
      dockerfile: Dockerfile
    container_name: neuroadapt-kokoro-tts
    ports:
      - "8880:8880"
    volumes:
      - kokoro-voices:/app/voices
    networks:
      - neuroadapt
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8880/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"

  gen-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neuroadapt-gen-engine
    ports:
      - "8001:8001"
    volumes:
      - ./logs:/home/app/logs
      - ./cache:/home/app/cache
    networks:
      - neuroadapt
    restart: unless-stopped
    depends_on:
      kokoro-tts:
        condition: service_healthy
      # Ollama doesn't need a health check — gen-engine will handle connection gracefully
      ollama:
        condition: service_started
    env_file:
      - .env  # Use .env for secrets and overrides; see .env.example
    environment:
      - OLLAMA_URL=http://ollama:11434
      - TTS_URL=http://kokoro-tts:8880
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CACHE_MAX_SIZE=${CACHE_MAX_SIZE:-500}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-300}
      - PROMETHEUS_ENABLED=${PROMETHEUS_ENABLED:-true}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:latest
    container_name: neuroadapt-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - neuroadapt
    restart: unless-stopped
    depends_on:
      gen-engine:
        condition: service_healthy
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  neuroadapt:
    driver: bridge

volumes:
  ollama-models:
    driver: local
  kokoro-voices:
    driver: local
  prometheus-data:
    driver: local
