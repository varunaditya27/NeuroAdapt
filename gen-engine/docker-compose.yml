#      - OLLAMA_NUM_THREADS=8
#    logging:
#      driver: "local"
#      options:
#        max-size: "10m"
#        max-file: "3"

  kokoro-tts:
    # Build from local Dockerfile — do not use inline pip install
    # See services/kokoro/Dockerfile for actual image definition
    build:
      context: ./services/kokoro
      dockerfile: Dockerfile
    container_name: neuroadapt-kokoro-tts
    ports:
      - "8880:8880"
    volumes:
      - kokoro-voices:/app/voices
    networks:
      - neuroadapt
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8880/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    container_name: neuroadapt-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-neuroadapt}
      - POSTGRES_USER=${POSTGRES_USER:-neuroadapt}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-neuroadapt_dev_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - neuroadapt
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neuroadapt} -d ${POSTGRES_DB:-neuroadapt}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"

  gen-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neuroadapt-gen-engine
    ports:
      - "8001:8001"
    volumes:
      - ./logs:/home/app/logs
      - ./cache:/home/app/cache
    networks:
      - neuroadapt
    restart: unless-stopped
    depends_on:
      kokoro-tts:
        condition: service_healthy
      # Ollama doesn't need a health check — gen-engine will handle connection gracefully
#      ollama:
#        condition: service_started
      postgres:
        condition: service_healthy
    env_file:
      - .env  # Use .env for secrets and overrides; see .env.example
    environment:
#      - OLLAMA_URL=http://ollama:11434
      - KOKORO_TTS_URL=http://kokoro-tts:8880
      - TTS_URL=http://kokoro-tts:8880
      - DATABASE_URL=${DATABASE_URL:-postgresql://neuroadapt:neuroadapt_dev_password@postgres:5432/neuroadapt}
      - POSTGRES_URL=${POSTGRES_URL:-postgresql://neuroadapt:neuroadapt_dev_password@postgres:5432/neuroadapt}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LATENCY_BUDGET_TEXT_SIMPLIFY=${LATENCY_BUDGET_TEXT_SIMPLIFY:-450}
      - GENERATION_CACHE_SIZE=${GENERATION_CACHE_SIZE:-500}
      - CACHE_MAX_SIZE=${CACHE_MAX_SIZE:-500}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-300}
      - PROMETHEUS_ENABLED=${PROMETHEUS_ENABLED:-true}
      - LATENCY_BUDGET_AUDIO=${LATENCY_BUDGET_AUDIO:-60}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"

