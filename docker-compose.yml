version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/neuroadapt.db
      - REDIS_URL=redis://redis:6379/0
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - neuroadapt_db:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - BACKEND_URL=http://backend:8000
      - BACKEND_INTERNAL_URL=http://backend:8000
      - GEN_ENGINE_INTERNAL_URL=http://gen-engine:8001
    depends_on:
      - backend
      - gen-engine

  gen-engine:
    build:
      context: ./gen-engine
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - ./gen-engine/.env
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
  neuroadapt_db:
