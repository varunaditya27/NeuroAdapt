version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: neuroadapt_postgres
    environment:
      POSTGRES_USER: neuroadapt
      POSTGRES_PASSWORD: neuroadapt
      POSTGRES_DB: neuroadapt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: neuroadapt_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data: