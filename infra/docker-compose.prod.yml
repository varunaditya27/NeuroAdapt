services:
  backend:
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 1g
    cpus: 1.0

  frontend:
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    cpus: 0.75

  gen-engine:
    mem_limit: 2g
    cpus: 2.0

  postgres:
    mem_limit: 1g
    cpus: 1.0

  redis:
    mem_limit: 256m
    cpus: 0.5

  prometheus:
    mem_limit: 512m
    cpus: 0.75
